{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Add New Lecturer</h2>
    <hr>
    <form method="POST" action="/add_lecturer">
        <div class="form-group">
            <label for="lecturer_name">Name</label>
            <input type="text" class="form-control" id="lecturer_name" name="lecturer_name"  style="width: 45%;"
                   pattern="[a-zA-Z ]+" required>
        </div>
        <div class="form-group">
            <label for="lecturer_workload">Employment Type</label>
            <input type="number" min="0" max="1" step=".1" class="form-control" id="lecturer_workload"
                   name="lecturer_workload" placeholder="1.0" style="width: 10%;" required>
            <small id="workloadHelp" class="text-muted">
            Must be between 0.1 and 1.0 (full-time)
            </small>
        </div>
        <div class="form-group">
            <label>Subject Expertise</label>
            <div class="row" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;">
                {% for subject in subjects %}
                    <div class="form-check" style="margin-bottom: 5px;">
                        <input class="form-check-input" type="checkbox" value="{{ loop.index }}" name="sme">
                        <label class="form-check-label">
                            {{ subjects[loop.index -1][0] + " - " + subjects[loop.index -1][1] }}</label>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Add</button>
        </div>
    </form>
</div>
{% endblock %}
