{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Create User</h2>
    <hr>
    <form method="POST" action="/create_user">
        <div class="form-group">
            <label>Email</label>
            <input type="text" class="form-control" name="user_email"
                   style="width: 70%;" required placeholder="name@example.com"
                   pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
        </div>
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" name="user_password"
                   style="width: 70%;" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
            <small>At least 8 characters, including uppercase, lowercase, and a number</small>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select class="form-control" style="width: 50%;" name="user_role" required>
                <option value="1">Admin</option>
                <option value="2">Manager</option>
                <option value="3" selected>Lecturer</option>
            </select>
        </div>
        <div class="form-group">
            <label>Link account to Lecturer</label>
            <select class="form-control" style="width: 50%;" name="lecturer_id">
                <option selected></option>
                {% for lecturer in unattached_lecturers %}
                    <option value="{{lecturer.id}}">{{ lecturer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Add</button>
        </div>
    </form>
</div>
{% endblock %}
