{% extends 'layout.html' %}
{% block content %}

    <div id="lecturers" class="container mt-5">
        <h2>Planned Subject Development</h2>
        <hr>
        <div class="form-group">
            <form action="/add_development">
                <button type="submit" class="btn btn-primary btn-custom">Add New</button>
            </form>
        </div>
        <table class="table table-bordered w-auto">
            <thead>
                <tr>
                    <th>Subject Name</th>
                    <th>Lecturer</th>
                    <th>Period</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="subject-table-body">
            {% for instance in development_instances %}
                <tr>
                    <td>{{ instance.subject_name }}</td>
                    <td>{{ instance.lecturer_name }}</td>
                    <td>{{ instance.period }}</td>
                    <td>
                        <form method="POST" action="/delete_development">
                            <input type="hidden" name="instance_id" value="{{ instance.id }}"/>
                            <button class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
